# Publishes to PyPI via trusted publishing on a GitHub release.
# Prerequisites (one-time): PyPI project 'popcorn' transferred, then add a
# trusted publisher on PyPI: repo tilde-research/popcorn, workflow publish.yml,
# environment pypi. No API tokens are stored.
name: Publish

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
