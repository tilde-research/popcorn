# Smoke CI for core, isolated backends, and multi-backend integration.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    # The dev group rather than `uvx ruff`, so the pinned version contributors run through
    # scripts/format.sh is the one that gates the PR. The group installs without the project,
    # so this stays a seconds-long job with no torch download.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv venv --clear
      - run: uv pip install --group dev
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv venv --clear
      - run: uv pip install --torch-backend=cpu -e . --group dev
        env:
          POPCORN_SKIP_REPORTS: "1"
      - run: uv run --no-sync pyright

  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv venv --clear --python ${{ matrix.python }}
      - run: uv pip install --torch-backend=cpu -e . --group dev
        env:
          POPCORN_SKIP_REPORTS: "1"
      - run: uv run --no-sync pytest tests/core -q

  kernels:
    # The matrix verifies registration and package isolation on CPU. Numerical smoke is
    # CUDA-gated; fa3, transformer_engine, and unsloth need CUDA torch and run only on
    # release hardware.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: none
            target: "."
          - backend: popcorn
            target: ".[fla]"
          - backend: cudnn
            target: ".[cudnn]"
          - backend: fla
            target: ".[fla]"
          - backend: liger
            target: ".[liger]"
          - backend: quack
            target: ".[quack]"
    name: kernels (${{ matrix.backend }})
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv venv --clear
      - shell: bash
        run: |
          support=()
          # Liger's GRPO adapter imports transformers without declaring it.
          if [ "${{ matrix.backend }}" = "liger" ]; then
            support=("transformers>=4.52.0,<5")
          fi
          uv pip install --torch-backend=cpu -e "${{ matrix.target }}" --group dev "${support[@]}"
        env:
          POPCORN_SKIP_REPORTS: "1"
      - run: uv run --no-sync pytest tests/kernels -q
        env:
          POPCORN_TEST_BACKEND: ${{ matrix.backend }}

  integration:
    # The defined pair: fla and liger are the only two that resolve against CPU torch, and
    # they overlap on seven ops. See tests/integration/test_backend_pair.py.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv venv --clear
      - run: uv pip install --torch-backend=cpu -e ".[fla,liger]" --group dev
        env:
          POPCORN_SKIP_REPORTS: "1"
      - run: uv run --no-sync pytest tests/integration -q

  derived:
    # The badge block is the only generated artifact that is committed; site data
    # is gitignored and rebuilt by update-site.yml, so there is nothing to check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv venv --clear
      # Badges and coverage are both derived from the pinned report cache, which the
      # install fetches (see setup.py).
      - run: uv pip install --torch-backend=cpu -e .
      - run: uv run --no-sync python scripts/update_readme.py --check
      # Keep the pin synchronized with the current registry and fingerprints. Passing
      # validation is a stricter release-hardware gate (`check_records.py --require-pass`).
      - run: uv run --no-sync python scripts/check_records.py

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: uv venv --clear
      - run: uv pip install --torch-backend=cpu -e . --group dev
        env:
          POPCORN_SKIP_REPORTS: "1"
      - run: uv run --no-sync pytest tests/core/test_site.py -q
      # Empty local reports are a deterministic build fixture; exporter contract tests
      # cover joins against actual rows.
      - run: uv run --no-sync python scripts/update_site.py
        env:
          POPCORN_SKIP_REPORTS: "1"
      - run: npm ci
        working-directory: site
      - run: npm test
        working-directory: site
      - run: npm run types:check
        working-directory: site
      - run: npm run build
        working-directory: site
        env:
          NEXT_PUBLIC_BASE_PATH: /popcorn

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # setup.py fetches the report cache into the wheel; no separate step needed.
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
