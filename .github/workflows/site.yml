# Docs + kernel explorer -> GitHub Pages. Dormant until Pages is enabled on
# the repository (Settings -> Pages -> Source: GitHub Actions), which requires
# the repo to be public; see RELEASING.md.
name: Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: uv venv
      - run: uv pip install --torch-backend=cpu -e .
      - run: uv run --no-sync python scripts/update_site.py
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
        env:
          NEXT_PUBLIC_BASE_PATH: /popcorn
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
