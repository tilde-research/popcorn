[project]
name = "popcorn"
version = "0.1.0"
description = "Kernel dispatch for PyTorch: torch references, optimized backends, autogenerated correctness and benchmarks."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Tilde Research" }]
keywords = ["pytorch", "kernels", "triton", "cuda", "gpu", "dispatch", "benchmark"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.5",
    "jaxtyping>=0.2.36",
    "packaging>=23.0",
    "einops>=0.8",
]

[project.urls]
Repository = "https://github.com/tilde-research/popcorn"
Issues = "https://github.com/tilde-research/popcorn/issues"

# One extra per backend, named exactly like the backend; pins mirror declare_backend.
[project.optional-dependencies]
fa3 = ["flash-attn-3>=3.0.0,<=3.0.0"]
fla = ["flash-linear-attention>=0.4.0,<=0.4.2"]
liger = ["liger-kernel>=0.6.0,<=0.7.0"]
quack = ["quack-kernels>=0.5.0,<=0.5.0"]
unsloth = ["unsloth>=2026.7.1,<=2026.7.5"]
# remove this option. Not intercompatible
all = [
    "flash-attn-3>=3.0.0,<=3.0.0",
    "flash-linear-attention>=0.4.0,<=0.4.2",
    "liger-kernel>=0.6.0,<=0.7.0",
    "quack-kernels>=0.5.0,<=0.5.0",
    "unsloth>=2026.7.1,<=2026.7.5",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8", "pyright>=1.1.390"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
popcorn = ["py.typed", "reports/*.jsonl"]
"popcorn.impls" = ["*.cu"]

[tool.ruff]
line-length = 127

[tool.ruff.lint]
# jaxtyping shape annotations (Float[Tensor, "... D"]) parse as forward refs.
ignore = ["F722", "F821"]

# Typed surface: the dispatcher and harness. Kernel references use jaxtyping and
# adapters intentionally leave parameters bare (annotations become dispatch gates).
[tool.pyright]
include = ["src/popcorn/core", "src/popcorn/bench", "src/popcorn/compile.py"]
exclude = ["**/__pycache__", ".venv"]
typeCheckingMode = "basic"
reportMissingImports = false
