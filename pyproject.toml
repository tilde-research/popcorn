[project]
name = "popcorn"
version = "0.1.1"
description = "A high performance development and dispatch library for high-performance machine learning kernels."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Tilde Research" }]
keywords = ["pytorch", "kernels", "triton", "cuda", "gpu", "dispatch", "benchmark"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.13.0,<=2.13.0",
    # The first-party implementations are Triton kernels gated on an exact version by
    # declare_backend("popcorn", ...), and torch pins Triton exactly in turn, so an
    # unbounded torch lets a fresh environment resolve past that gate and silently
    # register nothing: a sweep then reports the whole popcorn backend as unavailable
    # rather than failing. Pinning Triton here bounds torch to the versions that ship it.
    "triton>=3.7.1,<=3.7.1 ; platform_system == 'Linux'",
    "jaxtyping>=0.2.36",
    "packaging>=23.0",
    "einops>=0.8",
    # Published reports are Parquet, fetched from the hub rather than checked in:
    # both libraries are on the path from a fresh install to a dispatchable store.
    "pyarrow>=15.0",
    "huggingface-hub>=0.34",
]

[project.urls]
Repository = "https://github.com/tilde-research/popcorn"
Issues = "https://github.com/tilde-research/popcorn/issues"

[project.scripts]
popcorn = "popcorn.cli:main"

# One extra per backend, named exactly like the backend; pins mirror declare_backend.
# There is deliberately no aggregate extra: the backends pin mutually exclusive
# requirements, so an "everything" install does not resolve.
[project.optional-dependencies]
cudnn = ["nvidia-cudnn-frontend>=1.22.1,<=1.22.1"]
fa3 = ["flash-attn-3>=3.0.0,<=3.0.0"]
fla = ["flash-linear-attention>=0.5.2,<=0.5.2"]
liger = ["liger-kernel>=0.6.0,<=0.7.0"]
# quack 0.5.0 leaves nvidia-cutlass-dsl unbounded above (>=4.5.2), and 4.6 removed API
# the 0.5.0 kernels import (cutlass.cute.core.ThrMma), so the DSL needs the bound here.
quack = ["quack-kernels>=0.5.0,<=0.5.0", "nvidia-cutlass-dsl>=4.5.2,<4.6"]
transformer_engine = ["transformer-engine[pytorch]>=2.17.0,<=2.17.0"]
unsloth = ["unsloth>=2026.3.11,<=2026.3.11"]

[dependency-groups]
# ruff is pinned to a minor range, not a floor: its default rule set changes between minors
# (0.16 enabled BLE001, B023, I001 and others), so an unpinned linter silently turns a green
# CI red on an unrelated day. CI installs this group instead of running `uvx ruff`, so the
# version contributors get from scripts/format.sh is the version that gates the PR.
dev = ["pytest>=8.0", "ruff>=0.15.21,<0.16", "pyright>=1.1.390", "submitit>=1.5.3"]

# FlashAttention-3 is source-only: it lives in the `hopper/` subdirectory of the
# flash-attention repository and publishes nothing to PyPI. The extra above stays a plain
# version pin because PyPI rejects direct references in published metadata; the source is
# resolved here, where it applies to this repository only. Pinned to the commit verified to
# declare flash_attn_3 3.0.0 -- FA3 has no release tags of its own.
[tool.uv.sources]
flash-attn-3 = { git = "https://github.com/Dao-AILab/flash-attention", subdirectory = "hopper", rev = "849f660f73b176e5ad5670e7f822c7fa9f3eaf8b" }

# FA3 exposes only dynamic metadata, and its setup.py imports torch and its build tools
# before uv can read that metadata. Mirror the pinned commit's runtime metadata so a
# lock-less `uv sync` can resolve every extra without executing the setup.py.
[[tool.uv.dependency-metadata]]
name = "flash-attn-3"
version = "3.0.0"
requires-python = ">=3.10"
requires-dist = ["torch", "einops", "packaging", "ninja"]

# Build FA3 in isolation with the exact torch selected for this project. Keeping the setup
# imports in the build environment avoids a persistent two-step install and rebuilding
# against some other torch version, which can leave an extension that fails at import time.
[tool.uv.extra-build-dependencies]
flash-attn-3 = [
    { requirement = "torch", match-runtime = true },
    "setuptools",
    "wheel",
    "packaging",
    "ninja",
]

[build-system]
# huggingface-hub is a build requirement because setup.py fetches the report cache on the
# way in; see setup.py for why the build is the only hook an install has.
requires = ["setuptools>=77", "huggingface-hub>=0.34"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
popcorn = ["py.typed", "reports/*.parquet", "reports/REVISION", "reports/.revision"]
"popcorn.impls" = ["*.cu"]

[tool.ruff]
line-length = 127

[tool.ruff.lint]
# jaxtyping shape annotations (Float[Tensor, "... D"]) parse as forward refs.
ignore = ["F722", "F821"]

[tool.ruff.lint.per-file-ignores]
# Every backend must be declared before the kernel modules import, because each one
# registers implementations against a declared name. The order is the contract, so the
# imports cannot move above the declare_backend calls.
"src/popcorn/kernels/__init__.py" = ["E402"]

# Typed surface: the dispatcher and harness. Kernel references use jaxtyping and
# adapters intentionally leave parameters bare (annotations become dispatch gates).
[tool.pyright]
include = ["src/popcorn/core", "src/popcorn/bench", "src/popcorn/cli.py", "src/popcorn/compile.py"]
exclude = ["**/__pycache__", ".venv"]
typeCheckingMode = "basic"
reportMissingImports = false
